<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GitHub Open Source Radar</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}body{background:#0b1120;color:#e2e8f0;margin:0}main{max-width:1180px;margin:0 auto;padding:46px 22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.eyebrow{color:#67e8f9;font-weight:700;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(28px,4vw,43px);letter-spacing:-.05em;margin:12px 0}p{color:#94a3b8;line-height:1.6}.panel{background:#101b30;border:1px solid #243249;border-radius:18px;overflow:hidden;margin-top:30px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:22px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap}button,select{background:#1e293b;border:1px solid #34445f;border-radius:9px;padding:10px 14px;color:#e2e8f0;cursor:pointer}button.active{background:#0891b2;border-color:#22d3ee;color:white}select{min-width:145px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:17px 18px;border-top:1px solid #243249}th{color:#94a3b8;font-size:12px;letter-spacing:.05em;text-transform:uppercase}td{font-size:14px}tr:hover td{background:#14243d}a{color:#e2e8f0;text-decoration:none;font-weight:650}a:hover{color:#67e8f9}.rank{color:#94a3b8}.positive{color:#34d399;font-weight:700}.muted{font-size:12px;color:#94a3b8}.pill{background:#23304a;padding:5px 8px;border-radius:6px;font-size:12px}.notice{border:1px solid #334155;border-radius:10px;padding:14px 18px;background:#122038;margin-top:22px;color:#cbd5e1;font-size:13px}.scroll{overflow-x:auto}.empty{padding:48px;text-align:center}.description{max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a6b3c8}@media(max-width:760px){.description{max-width:170px}th,td{padding:14px 10px}main{padding:28px 12px}}</style></head>
<body><main><div class="hero"><div><div class="eyebrow">OPEN SOURCE INTELLIGENCE</div><h1>GitHub Open Source Radar <span style="color:#22d3ee">↗</span></h1><p>发现正在快速增长的开源项目。按指定时间窗口的新增 Star 排名。</p></div><div><div class="muted">候选仓库数量</div><h1 id="count">—</h1></div></div><div class="notice" id="notice">当前为候选池榜单，不代表整个 GitHub 的完整全量排名。数据来源：GitHub 官方 API。</div>
<section class="panel"><div class="toolbar"><div class="tabs" id="tabs"><button data-w="7d">一周</button><button data-w="30d" class="active">一个月</button><button data-w="90d">一季度</button><button data-w="6m">半年</button><button data-w="1y">一年</button></div><label>开发语言 <select id="language"><option value="">全部语言</option><option>Python</option><option>TypeScript</option><option>JavaScript</option><option>Go</option><option>Rust</option><option>Java</option><option>C++</option></select></label></div>
<div class="scroll"><table><thead><tr><th>#</th><th>项目</th><th>期间新增 ⭐</th><th>当前 ⭐</th><th>增长率</th><th>语言</th><th>简介</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">正在读取本地数据…</td></tr></tbody></table></div></section><p id="stamp" class="muted"></p></main>
<script>let windowKey='30d';const fmt=n=>n==null?'—':new Intl.NumberFormat('en-US').format(n);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function render(){const r=await fetch('/api/rankings?window='+windowKey+'&language='+encodeURIComponent(document.querySelector('#language').value));const data=await r.json();if(!r.ok)throw Error(data.error);document.querySelector('#count').textContent=fmt(data.candidate_pool);document.querySelector('#stamp').textContent=data.last_sync?'最近采集：'+data.last_sync.completed_at+' | 状态：'+data.last_sync.status:'尚未运行数据采集';document.querySelector('#rows').innerHTML=data.items.length?data.items.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(x.full_name)} ↗</a></td><td class="positive">+${fmt(x.growth)}</td><td>${fmt(x.stars)}</td><td>${x.growth_rate==null?'—':'+'+x.growth_rate+'%'}</td><td><span class="pill">${escapeHtml(x.language||'—')}</span></td><td class="description" title="${escapeHtml(x.description)}">${escapeHtml(x.description||'—')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">还没有数据。先在终端运行 python -m radar.sync --limit 30</td></tr>';}document.querySelector('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-w]');if(!b)return;windowKey=b.dataset.w;document.querySelectorAll('button[data-w]').forEach(x=>x.classList.toggle('active',x===b));render().catch(showError)});document.querySelector('#language').addEventListener('change',()=>render().catch(showError));function showError(e){document.querySelector('#rows').innerHTML='<tr><td colspan="7" class="empty">加载失败：'+escapeHtml(e.message)+'</td></tr>'}render().catch(showError)</script></body></html>
